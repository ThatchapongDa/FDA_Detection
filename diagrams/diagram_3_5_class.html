<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ภาพที่ 3.5 — Class Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: 'Geist', sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; }
  .page { background: #f5f5f5; max-width: 900px; width: 100%; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #2d3142; opacity: 0.5; text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-family: 'Instrument Serif', serif; font-size: 26px; font-weight: 400; color: #2d3142; margin-bottom: 6px; }
  .subtitle { font-family: 'Geist', sans-serif; font-size: 13px; color: #2d3142; opacity: 0.55; margin-bottom: 28px; }
  .diagram-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">บทที่ 3 · ขั้นตอนการดำเนินงาน</p>
  <h1>คลาสไดอะแกรม</h1>
  <p class="subtitle">Class Diagram — โครงสร้างคลาสหลักของระบบ FDA Detection System</p>
  <div class="diagram-wrap">
<svg viewBox="0 0 860 640" width="860" height="640"
     role="img" aria-labelledby="cls-title cls-desc"
     style="min-width:860px; font-family:'Geist',sans-serif;">
  <title id="cls-title">Class Diagram — FDA Detection System</title>
  <desc id="cls-desc">คลาสไดอะแกรมแสดงโครงสร้างและความสัมพันธ์ระหว่างคลาสหลัก 5 คลาสของระบบ</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b8fa8"/>
    </marker>
    <marker id="arrow-compose" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <polygon points="6 1, 12 6, 6 11, 0 6" fill="#2d3142"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polyline points="0 0, 10 4, 0 8" fill="none" stroke="#8b8fa8" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- === HELPER: class box macro ===
    Structure: header rect (class name), divider, attributes area, divider, methods area
  -->

  <!-- CLASS: FastAPI_App (accent / focal - center top) -->
  <rect x="328" y="32" width="204" height="132" rx="6" fill="#fff0ee" stroke="#bf4520" stroke-width="1.8"/>
  <rect x="328" y="32" width="204" height="32" rx="6" fill="#bf4520"/>
  <rect x="328" y="50" width="204" height="14" fill="#bf4520"/><!-- square bottom of header -->
  <text x="430" y="53" text-anchor="middle" fill="#ffffff" font-family="'Geist',sans-serif" font-size="12" font-weight="600">FastAPI_App</text>
  <line x1="328" y1="64" x2="532" y2="64" stroke="#bf4520" stroke-width="1"/>
  <text x="338" y="80" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ app: FastAPI</text>
  <text x="338" y="94" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ db_session: Session</text>
  <line x1="328" y1="102" x2="532" y2="102" stroke="#bf4520" stroke-width="0.8" opacity="0.4"/>
  <text x="338" y="118" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ scan_product(url)</text>
  <text x="338" y="132" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ stream_status(id)</text>
  <text x="338" y="146" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ get_scan_history()</text>

  <!-- CLASS: ShopeeScraper (left) -->
  <rect x="32" y="252" width="196" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <rect x="32" y="252" width="196" height="28" rx="6" fill="#2d3142"/>
  <rect x="32" y="268" width="196" height="12" fill="#2d3142"/>
  <text x="130" y="270" text-anchor="middle" fill="#ffffff" font-family="'Geist',sans-serif" font-size="11" font-weight="600">ShopeeScraper</text>
  <line x1="32" y1="280" x2="228" y2="280" stroke="#2d3142" stroke-width="1"/>
  <text x="42" y="296" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ browser: Playwright</text>
  <text x="42" y="310" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ base_url: str</text>
  <line x1="32" y1="318" x2="228" y2="318" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
  <text x="42" y="334" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ scrape(url) → dict</text>
  <text x="42" y="348" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ download_images()</text>
  <text x="42" y="362" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ parse_metadata()</text>
  <text x="42" y="376" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ crawl_keyword(kw)</text>

  <!-- CLASS: FDADetector (center) -->
  <rect x="308" y="252" width="244" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <rect x="308" y="252" width="244" height="28" rx="6" fill="#2d3142"/>
  <rect x="308" y="268" width="244" height="12" fill="#2d3142"/>
  <text x="430" y="270" text-anchor="middle" fill="#ffffff" font-family="'Geist',sans-serif" font-size="11" font-weight="600">FDADetector</text>
  <line x1="308" y1="280" x2="552" y2="280" stroke="#2d3142" stroke-width="1"/>
  <text x="318" y="296" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ dino_model: GroundingDINO</text>
  <text x="318" y="310" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ sam_model: SAM</text>
  <text x="318" y="324" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ ocr_engine: OCREngine</text>
  <line x1="308" y1="332" x2="552" y2="332" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
  <text x="318" y="348" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ detect_label(img) → BBox</text>
  <text x="318" y="362" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ segment_crop(bbox) → img</text>
  <text x="318" y="376" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ extract_text(img) → str</text>
  <text x="318" y="390" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ validate_fda_no(text) → bool</text>
  <text x="318" y="404" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ assess_risk(data) → RiskLevel</text>

  <!-- CLASS: OCREngine (right) -->
  <rect x="632" y="252" width="196" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <rect x="632" y="252" width="196" height="28" rx="6" fill="#2d3142"/>
  <rect x="632" y="268" width="196" height="12" fill="#2d3142"/>
  <text x="730" y="270" text-anchor="middle" fill="#ffffff" font-family="'Geist',sans-serif" font-size="11" font-weight="600">OCREngine</text>
  <line x1="632" y1="280" x2="828" y2="280" stroke="#2d3142" stroke-width="1"/>
  <text x="642" y="296" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ typhoon: TyphoonOCR</text>
  <text x="642" y="310" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ easy_ocr: EasyOCR</text>
  <text x="642" y="324" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ regex: re.Pattern</text>
  <line x1="632" y1="332" x2="828" y2="332" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
  <text x="642" y="348" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ read(img, mode) → str</text>
  <text x="642" y="362" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ extract_fda(text) → str</text>
  <text x="642" y="376" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">+ extract_reg(text) → str</text>

  <!-- CLASS: Database_Models (bottom center) -->
  <rect x="264" y="488" width="364" height="108" rx="6" fill="#eceff1" stroke="#2d3142" stroke-width="1.5"/>
  <rect x="264" y="488" width="364" height="28" rx="6" fill="#455a64"/>
  <rect x="264" y="504" width="364" height="12" fill="#455a64"/>
  <text x="446" y="506" text-anchor="middle" fill="#ffffff" font-family="'Geist',sans-serif" font-size="11" font-weight="600">Database_Models (SQLAlchemy ORM)</text>
  <line x1="264" y1="516" x2="628" y2="516" stroke="#455a64" stroke-width="1"/>
  <text x="274" y="532" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">ScanRecord: id, url, risk_level, fda_no, created_at</text>
  <text x="274" y="546" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">BoundingBox: id, scan_id, x, y, w, h, confidence</text>
  <text x="274" y="560" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">CrawlJob: id, keyword, status, found_count</text>
  <text x="274" y="574" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">Product: id, name, shop_name, price, image_url</text>

  <!-- === RELATIONSHIPS (drawn before boxes if needed, after here for clarity) === -->

  <!-- FastAPI_App *-- FDADetector (composition, 1-1) -->
  <path d="M 430 164 L 430 252" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="196" width="100" height="14" rx="2" fill="#f5f5f5"/>
  <text x="430" y="207" text-anchor="middle" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">Orchestrates 1..1</text>

  <!-- FastAPI_App *-- ShopeeScraper (association) -->
  <path d="M 328 120 L 130 120 L 130 252" fill="none" stroke="#8b8fa8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="176" y="110" width="72" height="14" rx="2" fill="#f5f5f5"/>
  <text x="212" y="121" text-anchor="middle" fill="#8b8fa8" font-family="'Geist Mono',monospace" font-size="9">Uses 1..1</text>

  <!-- FDADetector *-- OCREngine (composition) -->
  <path d="M 552 340 L 632 340" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="565" y="330" width="54" height="14" rx="2" fill="#f5f5f5"/>
  <text x="592" y="341" text-anchor="middle" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="9">Owns 1..1</text>

  <!-- FastAPI_App ..> Database_Models (dependency) -->
  <path d="M 430 164 L 430 460 L 446 488" fill="none" stroke="#8b8fa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
  <rect x="390" y="356" width="80" height="14" rx="2" fill="#f5f5f5"/>
  <text x="430" y="367" text-anchor="middle" fill="#8b8fa8" font-family="'Geist Mono',monospace" font-size="9">CRUD Ops</text>

  <!-- Legend -->
  <rect x="0" y="600" width="860" height="40" fill="#f5f5f5"/>
  <line x1="0" y1="600" x2="860" y2="600" stroke="#2d3142" stroke-width="0.5" opacity="0.15"/>
  <line x1="24" y1="620" x2="56" y2="620" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="62" y="624" fill="#8b8fa8" font-family="'Geist Mono',monospace" font-size="9">Composition / Association</text>
  <line x1="240" y1="620" x2="272" y2="620" stroke="#8b8fa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
  <text x="278" y="624" fill="#8b8fa8" font-family="'Geist Mono',monospace" font-size="9">Dependency «uses»</text>
  <rect x="430" y="612" width="36" height="16" rx="3" fill="#fff0ee" stroke="#bf4520" stroke-width="1.5"/>
  <text x="448" y="624" text-anchor="middle" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="8">Entry</text>
  <text x="492" y="624" fill="#8b8fa8" font-family="'Geist Mono',monospace" font-size="9">คลาสหลักของระบบ</text>
</svg>
  </div>
</div>
</body>
</html>
