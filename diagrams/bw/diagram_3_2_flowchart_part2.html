<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<style>
  body { margin: 0; padding: 10px; background: #ffffff; display: inline-block; font-family: Tahoma, 'Leelawadee UI', Arial, sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 640 860" width="640" height="860"
     role="img" aria-labelledby="fc2-title fc2-desc"
     style="min-width:640px; font-family:Tahoma, 'Leelawadee UI', Arial, sans-serif;">
  <title id="fc2-title">แผนภาพตรรกะการประมวลผลส่วนที่ 2</title>
  <desc id="fc2-desc">แผนภาพแสดงขั้นตอนการวิเคราะห์ด้วย AI Pipeline ตั้งแต่ GroundingDINO จนถึงการแสดงผล Credential Cards</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- AI Pipeline container box (drawn as background region) -->
  <rect x="40" y="80" width="560" height="488" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="320" y="102" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="10" letter-spacing="0.1em">AI ANALYSIS PIPELINE</text>

  <!-- === ARROWS === -->

  <!-- Node A → DINO -->
  <line x1="320" y1="44" x2="320" y2="120" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <!-- DINO → SAM -->
  <line x1="320" y1="184" x2="320" y2="228" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SAM → EasyOCR decision -->
  <line x1="320" y1="284" x2="320" y2="328" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: ซับซ้อน? YES (right) → Typhoon, NO (down) → EasyOCR -->
  <!-- NO → EasyOCR (down) -->
  <line x1="320" y1="380" x2="320" y2="416" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- YES → Typhoon (right) -->
  <path d="M 420 354 L 480 354 L 480 432" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

  <!-- EasyOCR & Typhoon both → merge dot at 500 -->
  <!-- EasyOCR (down) merge -->
  <line x1="320" y1="468" x2="320" y2="504" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Typhoon (down) merge -->
  <line x1="480" y1="484" x2="480" y2="504" stroke="#000000" stroke-width="1.5"/>
  <path d="M 480 504 L 480 516 L 324 516" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- merge → Regex -->
  <line x1="320" y1="516" x2="320" y2="572" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Regex → Risk Assessment -->
  <line x1="320" y1="624" x2="320" y2="668" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Risk → DB -->
  <line x1="320" y1="720" x2="320" y2="756" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

  <!-- DB → Show Results -->
  <line x1="320" y1="792" x2="320" y2="820" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- === BOXES === -->

  <!-- Node A in -->
  <ellipse cx="320" cy="28" rx="52" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="320" y="24" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="13" font-weight="600">Node A</text>
  <text x="320" y="38" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9">จากส่วนที่ 1</text>

  <!-- GroundingDINO -->
  <rect x="148" y="120" width="344" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="13" font-weight="600">GroundingDINO</text>
  <text x="320" y="160" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12">ตรวจจับตำแหน่งฉลากยา / เลข อย.</text>
  <text x="320" y="176" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Zero-shot · Text Prompt: "FDA label"</text>

  <!-- SAM -->
  <rect x="148" y="228" width="344" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="249" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="13" font-weight="600">SAM (Segment Anything Model)</text>
  <text x="320" y="267" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12">ครอปฉลากตามรูปทรงจริง (Precision Crop)</text>
  <text x="320" y="281" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Segmentation · ลดสัญญาณรบกวน</text>

  <!-- Decision: ฉลากซับซ้อน? -->
  <polygon points="320,328 420,354 320,380 220,354" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="350" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ฉลากซับซ้อน?</text>
  <text x="320" y="366" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">ภาษาไทย / แสงสะท้อน</text>

  <!-- NO label (down) -->
  <rect x="293" y="383" width="24" height="16" rx="2" fill="#ffffff"/>
  <text x="305" y="395" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9" letter-spacing="0.08em">NO</text>

  <!-- YES label (right) -->
  <rect x="427" y="346" width="28" height="16" rx="2" fill="#ffffff"/>
  <text x="441" y="358" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9" letter-spacing="0.08em">YES</text>

  <!-- EasyOCR box (left / down path) -->
  <rect x="176" y="416" width="288" height="52" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="436" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="13" font-weight="600">EasyOCR</text>
  <text x="320" y="454" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11">สกัดข้อความภาษาอังกฤษ / ตัวเลข</text>
  <text x="320" y="466" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">ประมวลผล Local · รวดเร็ว</text>

  <!-- Typhoon OCR box (right path) -->
  <rect x="396" y="432" width="176" height="52" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="484" y="451" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">Typhoon OCR</text>
  <text x="484" y="467" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11">ภาษาไทยซับซ้อน</text>
  <text x="484" y="480" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">LLM Vision · Context-aware</text>

  <!-- Merge dot -->
  <circle cx="320" cy="516" r="5" fill="#222222"/>

  <!-- Regex Engine -->
  <rect x="160" y="524" width="320" height="48" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="544" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="13" font-weight="600">Regex Engine</text>
  <text x="320" y="562" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">ตรวจสอบรูปแบบเลข อย. 13 หลัก · เลขทะเบียนยา</text>

  <!-- Risk Assessment -->
  <rect x="148" y="624" width="344" height="52" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="644" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="13" font-weight="600">Risk Assessment</text>
  <text x="320" y="662" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11">ประเมินระดับความเสี่ยงตาม พ.ร.บ.ยา 2510</text>
  <text x="320" y="674" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">MATCH · MISMATCH · NOT_FOUND · SHOP_ONLY</text>

  <!-- Database -->
  <rect x="196" y="720" width="248" height="36" rx="18" fill="#f4f4f4" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="742" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">บันทึกลงฐานข้อมูล PostgreSQL</text>

  <!-- Show Results (End) -->
  <ellipse cx="320" cy="840" rx="160" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="836" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">แสดง Credential Cards &amp; Bounding Box</text>
  <text x="320" y="852" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">จบการทำงาน</text>

  <!-- === LEGEND STRIP === -->
  <rect x="0" y="860" width="640" height="0"/>
</svg>
</body>
</html>
