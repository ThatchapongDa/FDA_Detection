<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<style>
  body { margin: 0; padding: 10px; background: #ffffff; display: inline-block; font-family: Tahoma, 'Leelawadee UI', Arial, sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 860 720" width="860" height="720"
     role="img" aria-labelledby="seq-title seq-desc"
     style="min-width:860px; font-family:Tahoma, 'Leelawadee UI', Arial, sans-serif;">
  <title id="seq-title">System Sequence Diagram — FDA Detection System</title>
  <desc id="seq-desc">แผนภาพลำดับการทำงานแสดงการสื่อสารระหว่างผู้ใช้งาน, React.js, FastAPI, AI Engine และ PostgreSQL</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
    <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- === ACTOR POSITIONS ===
    User: cx=80    React.js: cx=220    FastAPI: cx=400    AI Engine: cx=590    PostgreSQL: cx=770
  -->

  <!-- Actor boxes (top) -->
  <!-- User -->
  <rect x="32" y="16" width="96" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="80" y="32" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ผู้ใช้งาน</text>
  <text x="80" y="48" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8">User</text>

  <!-- React.js -->
  <rect x="168" y="16" width="104" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="220" y="32" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">หน้าเว็บ</text>
  <text x="220" y="48" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8">React.js Frontend</text>

  <!-- FastAPI -->
  <rect x="348" y="16" width="104" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="32" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ระบบหลังบ้าน</text>
  <text x="400" y="48" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8">FastAPI Backend</text>

  <!-- AI Engine -->
  <rect x="535" y="16" width="110" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="590" y="32" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">AI Engine</text>
  <text x="590" y="48" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8">DINO · SAM · Typhoon</text>

  <!-- PostgreSQL -->
  <rect x="722" y="16" width="96" height="40" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.5"/>
  <text x="770" y="32" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ฐานข้อมูล</text>
  <text x="770" y="48" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8">PostgreSQL</text>

  <!-- Lifelines -->
  <line x1="80" y1="56" x2="80" y2="660" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  <line x1="220" y1="56" x2="220" y2="660" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  <line x1="400" y1="56" x2="400" y2="660" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  <line x1="590" y1="56" x2="590" y2="660" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  <line x1="770" y1="56" x2="770" y2="660" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>

  <!-- === MESSAGES === -->

  <!-- 1. User → React: วาง URL สินค้า -->
  <line x1="88" y1="104" x2="212" y2="104" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="110" y="94" width="88" height="14" rx="2" fill="#ffffff"/>
  <text x="154" y="105" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9" letter-spacing="0.05em">วาง URL สินค้า</text>
  <text x="100" y="92" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">1</text>

  <!-- Activation bar: React -->
  <rect x="216" y="108" width="8" height="456" fill="#000000" fill-opacity="0.06" stroke="#000000" stroke-width="0.8"/>

  <!-- 2. React → FastAPI: POST /api/scan (SSE) -->
  <line x1="228" y1="132" x2="392" y2="132" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-link)"/>
  <rect x="262" y="120" width="104" height="14" rx="2" fill="#ffffff"/>
  <text x="314" y="131" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9" letter-spacing="0.04em">POST /api/scan (SSE)</text>
  <text x="238" y="128" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">2</text>

  <!-- Activation bar: FastAPI -->
  <rect x="396" y="136" width="8" height="392" fill="#000000" fill-opacity="0.06" stroke="#000000" stroke-width="0.8"/>

  <!-- 3. FastAPI → AI: วิเคราะห์รูปภาพ -->
  <line x1="408" y1="168" x2="582" y2="168" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="443" y="157" width="100" height="14" rx="2" fill="#ffffff"/>
  <text x="493" y="168" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9">ส่งภาพ AI Pipeline</text>
  <text x="416" y="164" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">3</text>

  <!-- Activation bar: AI Engine -->
  <rect x="586" y="172" width="8" height="196" fill="#000000" fill-opacity="0.08" stroke="#000000" stroke-width="0.8"/>

  <!-- Note inside AI activation: DINO → SAM → OCR -->
  <rect x="478" y="196" width="200" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" opacity="0.9"/>
  <text x="578" y="212" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="10">DINO → ตรวจจับฉลาก</text>
  <text x="578" y="228" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="10">SAM → ครอปฉลาก</text>
  <text x="578" y="244" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="10">Typhoon OCR → อ่านข้อความ</text>

  <!-- 4. AI → FastAPI: Bounding Box + OCR text -->
  <line x1="582" y1="368" x2="408" y2="368" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
  <rect x="430" y="357" width="120" height="14" rx="2" fill="#ffffff"/>
  <text x="490" y="368" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Bounding Box + OCR</text>
  <text x="418" y="363" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">4</text>

  <!-- 5. FastAPI (self): Regex + Risk Assessment -->
  <!-- Self-loop on FastAPI -->
  <path d="M 408 400 Q 460 400 460 420 Q 460 440 408 440" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="420" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9">Regex + Risk</text>
  <text x="412" y="396" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">5</text>

  <!-- 6. FastAPI → PostgreSQL: บันทึกข้อมูล -->
  <line x1="408" y1="472" x2="762" y2="472" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="461" width="120" height="14" rx="2" fill="#ffffff"/>
  <text x="580" y="472" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9">บันทึก tbl_scan_records</text>
  <text x="416" y="468" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">6</text>

  <!-- 7. PostgreSQL → FastAPI: ยืนยัน -->
  <line x1="762" y1="496" x2="408" y2="496" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
  <rect x="525" y="485" width="100" height="14" rx="2" fill="#ffffff"/>
  <text x="575" y="496" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">ยืนยันการบันทึกสำเร็จ</text>
  <text x="418" y="492" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">7</text>

  <!-- 8. FastAPI → React: Stream ผลลัพธ์ (accent - headline) -->
  <line x1="396" y1="528" x2="228" y2="528" stroke="#000000" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="252" y="516" width="112" height="14" rx="2" fill="#ffffff"/>
  <text x="308" y="527" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="9" letter-spacing="0.04em">SSE Stream · ผลการสแกน</text>
  <text x="236" y="524" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">8</text>

  <!-- 9. React → User: แสดง Credential Cards -->
  <line x1="216" y1="560" x2="88" y2="560" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
  <rect x="92" y="549" width="112" height="14" rx="2" fill="#ffffff"/>
  <text x="148" y="560" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">แสดง Credential Cards</text>
  <text x="94" y="556" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="8" opacity="0.6">9</text>

  <!-- Actor footer repetitions (bottom) -->
  <rect x="32" y="640" width="96" height="32" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="80" y="660" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ผู้ใช้งาน</text>
  <rect x="168" y="640" width="104" height="32" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="220" y="660" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">หน้าเว็บ</text>
  <rect x="348" y="640" width="104" height="32" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="400" y="660" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ระบบหลังบ้าน</text>
  <rect x="535" y="640" width="110" height="32" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="660" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">AI Engine</text>
  <rect x="722" y="640" width="96" height="32" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.2"/>
  <text x="770" y="660" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ฐานข้อมูล</text>

  <!-- Legend strip -->
  <rect x="0" y="680" width="860" height="40" fill="#ffffff"/>
  <line x1="0" y1="680" x2="860" y2="680" stroke="#000000" stroke-width="0.5" opacity="0.15"/>
  <line x1="24" y1="700" x2="64" y2="700" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-link)"/>
  <text x="70" y="704" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">คำสั่ง (HTTP/API)</text>
  <line x1="200" y1="700" x2="240" y2="700" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
  <text x="246" y="704" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">การตอบกลับ (Return)</text>
  <line x1="400" y1="700" x2="440" y2="700" stroke="#000000" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="446" y="704" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">ผลลัพธ์หลัก (Headline)</text>
</svg>
</body>
</html>
