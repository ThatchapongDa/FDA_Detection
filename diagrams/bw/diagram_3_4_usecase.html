<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<style>
  body { margin: 0; padding: 10px; background: #ffffff; display: inline-block; font-family: Tahoma, 'Leelawadee UI', Arial, sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 800 580" width="800" height="580"
     role="img" aria-labelledby="uc-title uc-desc"
     style="min-width:800px; font-family:Tahoma, 'Leelawadee UI', Arial, sans-serif;">
  <title id="uc-title">Use Case Diagram — FDA Detection System</title>
  <desc id="uc-desc">แผนภาพแสดงความสัมพันธ์ระหว่าง Actor และ Use Case ของระบบตรวจสอบผลิตภัณฑ์สุขภาพ</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
    <marker id="arrow-include" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- System boundary box -->
  <rect x="180" y="48" width="500" height="468" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430" y="38" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="10" letter-spacing="0.12em">FDA DETECTION SYSTEM</text>

  <!-- === ACTORS === -->

  <!-- Actor: เจ้าหน้าที่ (User) stick figure -->
  <circle cx="80" cy="120" r="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="80" y1="136" x2="80" y2="180" stroke="#000000" stroke-width="1.5"/>
  <line x1="52" y1="156" x2="108" y2="156" stroke="#000000" stroke-width="1.5"/>
  <line x1="80" y1="180" x2="56" y2="208" stroke="#000000" stroke-width="1.5"/>
  <line x1="80" y1="180" x2="104" y2="208" stroke="#000000" stroke-width="1.5"/>
  <text x="80" y="226" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">เจ้าหน้าที่</text>
  <text x="80" y="242" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">FDA Officer</text>

  <!-- Actor: ระบบ AI (secondary) stick figure -->
  <circle cx="720" cy="200" r="16" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <line x1="720" y1="216" x2="720" y2="260" stroke="#000000" stroke-width="1.5"/>
  <line x1="692" y1="236" x2="748" y2="236" stroke="#000000" stroke-width="1.5"/>
  <line x1="720" y1="260" x2="696" y2="288" stroke="#000000" stroke-width="1.5"/>
  <line x1="720" y1="260" x2="744" y2="288" stroke="#000000" stroke-width="1.5"/>
  <text x="720" y="306" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">AI Engine</text>
  <text x="720" y="322" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">DINO·SAM·Typhoon</text>

  <!-- Actor: Shopee Platform (external) -->
  <circle cx="720" cy="400" r="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="720" y1="416" x2="720" y2="456" stroke="#000000" stroke-width="1.5"/>
  <line x1="692" y1="432" x2="748" y2="432" stroke="#000000" stroke-width="1.5"/>
  <line x1="720" y1="456" x2="696" y2="484" stroke="#000000" stroke-width="1.5"/>
  <line x1="720" y1="456" x2="744" y2="484" stroke="#000000" stroke-width="1.5"/>
  <text x="720" y="502" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">Shopee Platform</text>
  <text x="720" y="518" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">ระบบภายนอก</text>

  <!-- === USE CASES (ellipses) === -->

  <!-- UC1: สแกนสินค้า URL เดียว (accent) -->
  <ellipse cx="350" cy="120" rx="140" ry="28" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="116" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">สแกนสินค้ารายชิ้น</text>
  <text x="350" y="132" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Single Scan (UC-01)</text>

  <!-- UC2: ดู Credential Cards -->
  <ellipse cx="570" cy="120" rx="100" ry="28" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="570" y="116" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ดู Credential Cards</text>
  <text x="570" y="132" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">UC-02</text>

  <!-- UC3: เปิด Deep Dive Modal -->
  <ellipse cx="570" cy="220" rx="100" ry="28" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="570" y="216" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="11" font-weight="600">ตรวจพยานหลักฐาน</text>
  <text x="570" y="232" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Deep Dive UC-03</text>

  <!-- UC4: ตั้งค่า Crawler -->
  <ellipse cx="350" cy="220" rx="140" ry="28" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="216" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">ตั้งค่าระบบ Crawler</text>
  <text x="350" y="232" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Auto-Scan Config (UC-04)</text>

  <!-- UC5: เฝ้าระวังอัตโนมัติ -->
  <ellipse cx="350" cy="320" rx="140" ry="28" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="316" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">ระบบเฝ้าสังเกตการณ์</text>
  <text x="350" y="332" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Autonomous Crawler (UC-05)</text>

  <!-- UC6: ดู Dashboard -->
  <ellipse cx="350" cy="420" rx="140" ry="28" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="416" text-anchor="middle" fill="#000000" font-family="Tahoma, 'Leelawadee UI', Arial, sans-serif" font-size="12" font-weight="600">ดูสถิติ Dashboard</text>
  <text x="350" y="432" text-anchor="middle" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">Intelligence Dashboard (UC-06)</text>

  <!-- === ASSOCIATIONS (actor to use case) === -->

  <!-- User → UC1 -->
  <line x1="112" y1="148" x2="208" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- User → UC4 -->
  <line x1="112" y1="168" x2="208" y2="218" stroke="#000000" stroke-width="1.5"/>
  <!-- User → UC5 -->
  <line x1="112" y1="178" x2="208" y2="318" stroke="#000000" stroke-width="1.5"/>
  <!-- User → UC6 -->
  <line x1="112" y1="192" x2="208" y2="418" stroke="#000000" stroke-width="1.5"/>

  <!-- AI Engine → UC1 (include: analyze image) -->
  <line x1="704" y1="216" x2="672" y2="220" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <!-- AI Engine → UC5 -->
  <line x1="704" y1="240" x2="492" y2="318" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <!-- Shopee → UC5 (Web Scraper pulls from Shopee) -->
  <line x1="704" y1="408" x2="492" y2="330" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-include)"/>

  <!-- Include arrows (UC1 includes UC2, UC2 includes UC3) -->
  <line x1="492" y1="120" x2="468" y2="120" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-include)"/>
  <rect x="415" y="110" width="58" height="13" rx="2" fill="#ffffff"/>
  <text x="444" y="120" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="8" letter-spacing="0.06em">«include»</text>

  <line x1="570" y1="148" x2="570" y2="192" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-include)"/>
  <rect x="540" y="164" width="58" height="13" rx="2" fill="#ffffff"/>
  <text x="569" y="174" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="8" letter-spacing="0.06em">«include»</text>

  <!-- Legend -->
  <rect x="0" y="540" width="800" height="40" fill="#ffffff"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#000000" stroke-width="0.5" opacity="0.15"/>
  <line x1="24" y1="560" x2="60" y2="560" stroke="#000000" stroke-width="1.5"/>
  <text x="66" y="564" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">ความสัมพันธ์ (Association)</text>
  <line x1="220" y1="560" x2="256" y2="560" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-include)"/>
  <text x="262" y="564" fill="#222222" font-family="Courier New, Tahoma, monospace" font-size="9">«include»</text>
  <ellipse cx="408" cy="560" rx="36" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="408" y="564" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="8">UC หลัก</text>
  <ellipse cx="520" cy="560" rx="36" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="520" y="564" text-anchor="middle" fill="#000000" font-family="Courier New, Tahoma, monospace" font-size="8">UC รอง</text>
</svg>
</body>
</html>
